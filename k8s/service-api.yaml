apiVersion: v1
kind: Service
metadata:
  name: bookapi
  namespace: default
spec:
  selector:
    app: bookapi
  type: LoadBalancer
  ports:
  - name: bookapi
    protocol: TCP
    port: 8080
    targetPort: 8080
    # If you set the `spec.type` field to `NodePort` and you want a specific port number,
    # you can specify a value in the `spec.ports[*].nodePort` field.